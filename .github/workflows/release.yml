name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux AppImage und DEB
    runs-on: ubuntu-24.04
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: Tauri-Linux-Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: npm-Abhängigkeiten installieren
        run: npm ci

      - name: Linux-Pakete bauen
        run: npm run tauri:build:linux

      - name: Linux-Pakete veröffentlichungsfähig ablegen
        run: |
          mkdir -p release-assets
          cp src-tauri/target/release/bundle/appimage/*.AppImage release-assets/
          cp src-tauri/target/release/bundle/deb/*.deb release-assets/

      - name: Linux-Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: rohrrunner-linux
          path: release-assets/*
          if-no-files-found: error

  build-windows:
    name: Windows NSIS
    runs-on: windows-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust einrichten
        uses: dtolnay/rust-toolchain@stable

      - name: npm-Abhängigkeiten installieren
        run: npm ci

      - name: Windows-App bauen
        run: npm run tauri:build:windows

      - name: Windows-Installer veröffentlichungsfähig ablegen
        uses: actions/upload-artifact@v4
        with:
          name: rohrrunner-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error

  release:
    name: GitHub Release erstellen
    needs: [build-linux, build-windows]
    runs-on: ubuntu-24.04
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Release-Artefakte laden
        uses: actions/download-artifact@v4
        with:
          pattern: rohrrunner-*
          path: release-assets
          merge-multiple: true

      - name: GitHub Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            test "${tag}" = "${GITHUB_REF_NAME}"
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            existing_assets="$(gh release view "${tag}" --json assets --jq '.assets[].name')"
            for asset in release-assets/*; do
              if printf '%s\n' "${existing_assets}" | grep -Fxq "$(basename "${asset}")"; then
                echo "Bereits veröffentlichtes Paket bleibt erhalten: $(basename "${asset}")"
              else
                gh release upload "${tag}" "${asset}"
              fi
            done
          else
            gh release create "${tag}" release-assets/* \
              --title "RohrRunner ${tag}" \
              --generate-notes
          fi
