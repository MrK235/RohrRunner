[package]
name = "rohrrunner"
version = "1.2.4"
description = "Lokale Rohrnetzplanung und technische Vorbemessung"
authors = ["RohrRunner"]
edition = "2021"

[lib]
name = "rohrrunner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression", "x11", "custom-protocol"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
